      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset="1" stop-color="#efeadd"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1180" cy="260" r="420" fill="#e7f1ea" opacity="0.65"/><circle cx="1300" cy="120" r="34" fill="#ec1b21" opacity="0.85"/>

